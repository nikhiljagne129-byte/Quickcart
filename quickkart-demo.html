<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>QuickKart — Groceries in 15 minutes</title>
<meta name="description" content="Order groceries, dairy, snacks and household essentials — delivered fast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F13; --glass-bg:rgba(255,255,255,0.05); --glass-border:rgba(255,255,255,0.08);
    --purple:#7C6FE9; --purple-dark:#6355D6; --green:#34D399; --red:#F87171;
    --text:#F4F3F8; --text-muted:#9B9AA8; --radius:16px; --radius-sm:10px; --max:1200px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg);
    background-image:radial-gradient(circle at 15% 0%, rgba(124,111,233,0.12), transparent 40%),
                      radial-gradient(circle at 85% 20%, rgba(52,211,153,0.08), transparent 40%);
    background-attachment:fixed; color:var(--text); font-family:'Inter',sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Poppins',sans-serif; margin:0;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--purple); outline-offset:2px;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 16px;}
  .glass-card{background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:999px; padding:12px 22px; font-weight:600; font-size:0.92rem; transition:transform .15s ease,background .15s ease,opacity .15s ease;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-primary{background:var(--purple); color:#fff;}
  .btn-primary:hover:not(:disabled){background:var(--purple-dark); transform:translateY(-1px);}
  .btn-outline{background:transparent; border:1.5px solid var(--glass-border); color:var(--text);}
  .btn-outline:hover:not(:disabled){border-color:var(--purple);}
  .btn-success{background:var(--green); color:#05261C;}
  .spinner{width:22px; height:22px; border:3px solid rgba(255,255,255,0.15); border-top-color:var(--purple); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .view{display:none;}
  .view.active{display:block;}

  /* header */
  header{position:sticky; top:0; z-index:40; background:rgba(15,15,19,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--glass-border);}
  nav.wrap{display:flex; align-items:center; justify-content:space-between; height:68px;}
  .logo{display:flex; align-items:center; gap:10px; background:none; border:none; color:inherit;}
  .logo-icon{font-size:1.6rem;}
  .logo-text{font-weight:700; font-size:1.15rem;}
  .tagline{font-size:0.7rem; color:var(--text-muted);}
  @media (max-width:480px){.tagline{display:none;}}
  .lang-toggle{display:flex; align-items:center; gap:6px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:999px; padding:8px 14px; color:var(--text-muted); font-size:0.82rem; font-weight:600;}
  .lang-toggle .active{color:var(--purple);}

  /* controls */
  .controls{padding-top:20px;}
  .search-wrap{position:relative; display:flex; align-items:center; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-sm); padding:0 14px; margin-bottom:14px;}
  .search-wrap input{flex:1; background:transparent; border:none; outline:none; color:var(--text); padding:13px 10px; font-size:0.95rem;}
  .search-wrap input::placeholder{color:var(--text-muted);}
  .pill-row{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 12px; scrollbar-width:none;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{flex-shrink:0; background:var(--glass-bg); border:1px solid var(--glass-border); color:var(--text-muted); border-radius:999px; padding:9px 18px; font-size:0.85rem; font-weight:500; white-space:nowrap;}
  .pill.pill-active{background:var(--purple); border-color:var(--purple); color:#fff;}

  /* grid */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding-bottom:110px;}
  @media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media (min-width:960px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{display:flex; flex-direction:column; overflow:hidden; transition:transform .15s ease,border-color .15s ease;}
  .card:hover{transform:translateY(-3px); border-color:rgba(124,111,233,0.4);}
  .card-emoji{height:96px; display:flex; align-items:center; justify-content:center; font-size:2.6rem; background:rgba(255,255,255,0.03); cursor:pointer;}
  .card-body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:4px;}
  .card-name{font-weight:600; font-size:0.92rem; cursor:pointer;}
  .card-desc{font-size:0.76rem; color:var(--text-muted); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-footer{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .card-price{font-weight:700; font-size:1rem;}
  .add-btn{padding:8px 16px; font-size:0.82rem;}

  /* stepper */
  .stepper{display:flex; align-items:center; justify-content:space-between; background:var(--purple); border-radius:999px; padding:4px; width:92px;}
  .stepper.md{width:116px; padding:6px;}
  .stepper button{background:rgba(255,255,255,0.15); border:none; color:#fff; width:26px; height:26px; border-radius:50%; font-size:1rem; display:flex; align-items:center; justify-content:center; line-height:1;}
  .stepper.md button{width:32px; height:32px;}
  .stepper span{color:#fff; font-weight:600; font-size:0.88rem; min-width:20px; text-align:center;}

  /* floating cart */
  .fab{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:30; display:none; align-items:center; gap:12px; background:var(--purple); color:#fff; border:none; border-radius:999px; padding:14px 22px; box-shadow:0 12px 32px rgba(124,111,233,0.45); font-weight:600; font-size:0.92rem;}
  .fab.visible{display:flex;}
  .fab-badge{background:rgba(255,255,255,0.25); border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:0.78rem;}

  /* product detail */
  .back-link{background:none; border:none; color:var(--text-muted); font-size:0.88rem; padding:20px 0 12px;}
  .detail-card{display:flex; flex-direction:column; overflow:hidden; margin-bottom:40px;}
  @media (min-width:640px){.detail-card{flex-direction:row;}}
  .detail-emoji{width:100%; height:200px; display:flex; align-items:center; justify-content:center; font-size:5rem; background:rgba(255,255,255,0.03);}
  @media (min-width:640px){.detail-emoji{width:260px; height:auto;}}
  .detail-info{padding:24px; flex:1;}
  .detail-category{font-size:0.75rem; color:var(--purple); font-weight:600; text-transform:uppercase; letter-spacing:0.05em;}
  .detail-name{font-size:1.6rem; margin:10px 0 12px;}
  .detail-desc{color:var(--text-muted); font-size:0.95rem; margin:0 0 22px;}
  .detail-price-row{display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .detail-price{font-size:1.6rem; font-weight:700;}
  .related-title{font-size:1.15rem; margin:0 0 16px;}
  .related-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding-bottom:100px;}
  @media (min-width:640px){.related-grid{grid-template-columns:repeat(4,1fr);}}

  /* checkout */
  .checkout-page{padding:20px 16px 60px; max-width:640px;}
  .co-title{font-size:1.5rem; margin-bottom:18px;}
  .co-section{padding:20px; margin-bottom:18px;}
  .co-section-title{font-size:1.02rem; margin-bottom:16px;}
  .cart-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--glass-border);}
  .cart-row:last-child{border-bottom:none; padding-bottom:0;}
  .cart-row:first-child{padding-top:0;}
  .cart-item-emoji{font-size:1.6rem; flex-shrink:0;}
  .cart-item-info{flex:1; display:flex; flex-direction:column; min-width:0;}
  .cart-item-name{font-weight:600; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cart-item-price{font-size:0.76rem; color:var(--text-muted);}
  .remove-btn{background:none; border:none; color:var(--text-muted); font-size:0.9rem; padding:6px; flex-shrink:0;}
  .remove-btn:hover{color:var(--red);}
  .delivery-toggle{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .delivery-option{background:var(--glass-bg); border:1.5px solid var(--glass-border); border-radius:var(--radius-sm); padding:16px; display:flex; flex-direction:column; gap:6px; color:var(--text); font-size:0.9rem; text-align:left;}
  .delivery-option.active{border-color:var(--purple); background:rgba(124,111,233,0.12);}
  .delivery-price{font-weight:700; font-size:0.85rem; color:var(--green);}
  .summary-row{display:flex; justify-content:space-between; padding:7px 0; color:var(--text-muted); font-size:0.92rem;}
  .summary-total{border-top:1px solid var(--glass-border); margin-top:6px; padding-top:14px; color:var(--text); font-weight:700; font-size:1.05rem;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px; font-size:0.85rem; color:var(--text-muted);}
  .field input,.field textarea{background:var(--glass-bg); border:1.5px solid var(--glass-border); border-radius:var(--radius-sm); padding:12px 14px; color:var(--text); font-size:0.94rem; outline:none; resize:vertical; width:100%;}
  .field input:focus,.field textarea:focus{border-color:var(--purple);}
  .submit-btn{width:100%; padding:15px; font-size:1rem; margin-top:6px;}
  .form-error{color:var(--red); font-size:0.85rem; margin:0 0 12px;}
  .empty-state{text-align:center; padding:100px 20px; color:var(--text-muted); display:flex; flex-direction:column; gap:18px; align-items:center;}

  /* otp */
  .otp-card{max-width:420px; margin:60px auto; padding:36px 28px; text-align:center;}
  .otp-title{font-size:1.4rem; margin-bottom:10px;}
  .otp-subtitle{color:var(--text-muted); font-size:0.9rem; margin:0;}
  .otp-demo-hint{margin-top:14px; font-size:0.78rem; color:var(--green); background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.25); border-radius:8px; padding:8px 12px;}
  .otp-row{display:flex; gap:10px; justify-content:center; margin:24px 0;}
  .otp-box{width:46px; height:56px; text-align:center; font-size:1.4rem; font-weight:700; color:var(--text); background:var(--glass-bg); border:1.5px solid var(--glass-border); border-radius:var(--radius-sm); outline:none;}
  .otp-box:focus{border-color:var(--purple);}
  @media (max-width:420px){.otp-box{width:40px; height:50px; font-size:1.2rem;}}
  .resend-btn{display:block; margin:18px auto 0; background:none; border:none; color:var(--purple); font-size:0.86rem; font-weight:600;}
  .resend-btn:disabled{color:var(--text-muted); cursor:not-allowed;}

  /* tracking */
  .track-page{max-width:560px; padding:20px 16px 60px; margin:0 auto;}
  .success-banner{display:flex; align-items:center; gap:14px; padding:20px; margin-bottom:18px; border-color:rgba(52,211,153,0.4); background:rgba(52,211,153,0.08);}
  .success-icon{font-size:2rem;}
  .success-title{font-size:1.05rem; color:var(--green);}
  .success-subtitle{margin:2px 0 0; font-size:0.85rem; color:var(--text-muted);}
  .header-card{padding:18px 20px; margin-bottom:18px;}
  .order-ref-label{font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em;}
  .order-ref{font-size:1.3rem; margin-top:4px;}
  .track-section{padding:20px; margin-bottom:18px;}
  .track-section-title{font-size:1rem; margin-bottom:14px;}
  .pay-btn{display:flex; width:100%; padding:16px; font-size:1.02rem; margin-bottom:18px;}
  .item-row{display:flex; justify-content:space-between; padding:8px 0; font-size:0.9rem; color:var(--text-muted);}
  .total-row{border-top:1px solid var(--glass-border); margin-top:6px; padding-top:14px; color:var(--text); font-weight:700;}
  .demo-controls{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .demo-controls button{font-size:0.75rem; padding:7px 12px;}

  /* status timeline */
  .timeline{display:flex; flex-direction:column; padding:8px 0;}
  .tl-step{display:flex; align-items:flex-start; gap:16px;}
  .tl-marker-col{display:flex; flex-direction:column; align-items:center;}
  .tl-marker{width:32px; height:32px; border-radius:50%; background:var(--glass-bg); border:1.5px solid var(--glass-border); color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:700; flex-shrink:0;}
  .tl-marker.done{background:var(--green); border-color:var(--green); color:#05261C;}
  .tl-line{width:2px; flex:1; min-height:28px; background:var(--glass-border);}
  .tl-line.done{background:var(--green);}
  .tl-label{padding-top:5px; color:var(--text-muted); font-size:0.92rem; padding-bottom:22px;}
  .tl-label.done{color:var(--text); font-weight:600;}

  .demo-banner{background:var(--purple-dark); color:#EAE8FF; text-align:center; font-size:0.78rem; padding:9px 16px; font-family:monospace;}
  .demo-banner strong{color:#fff;}
</style>
</head>
<body>

<div class="demo-banner">This is a <strong>static single-file demo</strong> — checkout, OTP and order tracking are simulated in-browser (no real backend or payments).</div>

<header>
  <nav class="wrap">
    <button class="logo" onclick="showView('catalog')">
      <span class="logo-icon">⚡</span>
      <div>
        <div class="logo-text" data-i18n="appName">QuickKart</div>
        <div class="tagline" data-i18n="tagline">Groceries delivered in 15 minutes</div>
      </div>
    </button>
    <button class="lang-toggle" onclick="toggleLang()">
      <span id="lang-en" class="active">EN</span><span>/</span><span id="lang-hi">हि</span>
    </button>
  </nav>
</header>

<!-- CATALOG VIEW -->
<section id="view-catalog" class="view active">
  <div class="wrap">
    <div class="controls">
      <div class="search-wrap">
        <span>🔍</span>
        <input id="search-input" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Search for products..." oninput="renderCatalog()">
      </div>
      <div class="pill-row" id="category-pills"></div>
    </div>
    <div class="grid" id="product-grid"></div>
  </div>
</section>

<!-- PRODUCT DETAIL VIEW -->
<section id="view-detail" class="view">
  <div class="wrap">
    <button class="back-link" onclick="showView('catalog')">← <span data-i18n="backToCatalog">Back to catalog</span></button>
    <div class="glass-card detail-card" id="detail-card"></div>
    <div>
      <h2 class="related-title" data-i18n="relatedProducts">You might also like</h2>
      <div class="related-grid" id="related-grid"></div>
    </div>
  </div>
</section>

<!-- CHECKOUT VIEW -->
<section id="view-checkout" class="view">
  <div class="wrap checkout-page" id="checkout-content"></div>
</section>

<!-- OTP VIEW -->
<section id="view-otp" class="view">
  <div class="wrap">
    <div class="glass-card otp-card">
      <h1 class="otp-title" data-i18n="verifyOtp">Verify OTP</h1>
      <p class="otp-subtitle"><span data-i18n="otpSentTo">We sent a 6-digit code to</span> <strong id="otp-email">your email</strong></p>
      <div class="otp-demo-hint">Demo mode: your code is <strong id="otp-demo-code">------</strong></div>
      <div class="otp-row" id="otp-row"></div>
      <p class="form-error" id="otp-error" style="display:none;"></p>
      <button class="btn btn-primary" id="otp-verify-btn" style="width:100%;" onclick="verifyOtp()" data-i18n="verify">Verify</button>
      <button class="resend-btn" id="otp-resend-btn" onclick="resendOtp()" data-i18n="resendOtp">Resend OTP</button>
    </div>
  </div>
</section>

<!-- TRACKING VIEW -->
<section id="view-track" class="view">
  <div class="wrap track-page" id="track-content"></div>
</section>

<button class="fab" id="fab" onclick="showView('checkout')">
  <span class="fab-badge" id="fab-count">0</span>
  <span data-i18n="viewCart">View Cart</span>
  <span id="fab-total">₹0</span>
</button>

<script>
/* ================= i18n ================= */
const translations = {
  en: {
    appName:'QuickKart', tagline:'Groceries delivered in 15 minutes', searchPlaceholder:'Search for products...',
    allCategories:'All', addToCart:'Add', outOfStock:'Out of stock', viewCart:'View Cart', yourCart:'Your Cart',
    emptyCart:'Your cart is empty', subtotal:'Subtotal', deliveryCharge:'Delivery Charge', free:'Free', total:'Total',
    checkout:'Proceed to Checkout', relatedProducts:'You might also like', backToCatalog:'Back to catalog',
    deliveryOption:'Delivery Option', homeDelivery:'Home Delivery', selfPickup:'Self Pickup', orderSummary:'Order Summary',
    yourDetails:'Your Details', fullName:'Full Name', email:'Email', phone:'Phone Number', notes:'Delivery Notes (optional)',
    placeOrder:'Place Order', placingOrder:'Placing order...', verifyOtp:'Verify OTP', otpSentTo:'We sent a 6-digit code to',
    resendOtp:'Resend OTP', resendIn:'Resend in', verify:'Verify', verifying:'Verifying...', invalidOtp:'Invalid OTP. Please try again.',
    orderStatus:'Order Status', orderRef:'Order ID', statusVerified:'Verified', statusAccepted:'Accepted', statusPaid:'Paid',
    statusShipped:'Shipped', statusDelivered:'Delivered', payNow:'Pay Now', shippingInfo:'Shipping Information', courier:'Courier',
    trackingId:'Tracking ID', eta:'Estimated Arrival', paymentSuccess:'Payment Successful!', thankYou:'Thank you for your order.',
    remove:'Remove', continueDemo:'Advance to next stage (demo)'
  },
  hi: {
    appName:'क्विककार्ट', tagline:'15 मिनट में किराना डिलीवरी', searchPlaceholder:'प्रोडक्ट खोजें...',
    allCategories:'सभी', addToCart:'जोड़ें', outOfStock:'स्टॉक खत्म', viewCart:'कार्ट देखें', yourCart:'आपका कार्ट',
    emptyCart:'आपका कार्ट खाली है', subtotal:'सबटोटल', deliveryCharge:'डिलीवरी चार्ज', free:'मुफ़्त', total:'कुल',
    checkout:'चेकआउट करें', relatedProducts:'आपको यह भी पसंद आ सकता है', backToCatalog:'कैटलॉग पर वापस जाएं',
    deliveryOption:'डिलीवरी विकल्प', homeDelivery:'होम डिलीवरी', selfPickup:'सेल्फ पिकअप', orderSummary:'ऑर्डर सारांश',
    yourDetails:'आपकी जानकारी', fullName:'पूरा नाम', email:'ईमेल', phone:'फ़ोन नंबर', notes:'डिलीवरी नोट्स (वैकल्पिक)',
    placeOrder:'ऑर्डर करें', placingOrder:'ऑर्डर हो रहा है...', verifyOtp:'OTP सत्यापित करें', otpSentTo:'हमने 6 अंकों का कोड भेजा है',
    resendOtp:'OTP फिर से भेजें', resendIn:'फिर से भेजें', verify:'सत्यापित करें', verifying:'सत्यापित हो रहा है...', invalidOtp:'गलत OTP। कृपया पुनः प्रयास करें।',
    orderStatus:'ऑर्डर स्थिति', orderRef:'ऑर्डर आईडी', statusVerified:'सत्यापित', statusAccepted:'स्वीकृत', statusPaid:'भुगतान हुआ',
    statusShipped:'भेज दिया गया', statusDelivered:'डिलीवर हो गया', payNow:'अभी भुगतान करें', shippingInfo:'शिपिंग जानकारी', courier:'कूरियर',
    trackingId:'ट्रैकिंग आईडी', eta:'अनुमानित समय', paymentSuccess:'भुगतान सफल!', thankYou:'आपके ऑर्डर के लिए धन्यवाद।',
    remove:'हटाएं', continueDemo:'अगले चरण पर जाएं (डेमो)'
  }
};
let lang = localStorage.getItem('qk_lang') || 'en';
function t(key){ return (translations[lang] && translations[lang][key]) || translations.en[key] || key; }
function toggleLang(){
  lang = lang === 'en' ? 'hi' : 'en';
  localStorage.setItem('qk_lang', lang);
  applyTranslations();
  renderCatalog();
  if(document.getElementById('view-checkout').classList.contains('active')) renderCheckout();
  if(document.getElementById('view-track').classList.contains('active')) renderTracking();
}
function applyTranslations(){
  document.getElementById('lang-en').classList.toggle('active', lang==='en');
  document.getElementById('lang-hi').classList.toggle('active', lang==='hi');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
}

/* ================= product data ================= */
const PRODUCTS = [
  {id:'p1',name:'Basmati Rice 5kg',category:'Grocery',price:480,emoji:'🍚',description:'Premium aged basmati rice, 5kg pack',stock_qty:120},
  {id:'p2',name:'Toor Dal 1kg',category:'Grocery',price:145,emoji:'🫘',description:'Unpolished toor dal, 1kg',stock_qty:200},

const CATEGORIES = [...new Set(PRODUCTS.map(p=>p.category))];
const DELIVERY_CHARGE = 40;

/* ================= cart state ================= */
let cart = JSON.parse(localStorage.getItem('qk_cart') || '{}'); // {productId: quantity}
let deliveryType = localStorage.getItem('qk_delivery') || 'delivery';
let activeCategory = 'all';
let currentProductId = null;

function saveCart(){ localStorage.setItem('qk_cart', JSON.stringify(cart)); updateFab(); }
function getQty(id){ return cart[id] || 0; }
function addToCart(id){ cart[id] = (cart[id]||0)+1; saveCart(); renderCatalog(); if(currentProductId===id) renderDetail(id); }
function incQty(id){ cart[id] = (cart[id]||0)+1; saveCart(); renderCatalog(); if(currentProductId===id) renderDetail(id); if(document.getElementById('view-checkout').classList.contains('active')) renderCheckout(); }
function decQty(id){
  if(!cart[id]) return;
  cart[id] -= 1;
  if(cart[id] <= 0) delete cart[id];
  saveCart(); renderCatalog();
  if(currentProductId===id) renderDetail(id);
  if(document.getElementById('view-checkout').classList.contains('active')) renderCheckout();
}
function removeFromCart(id){ delete cart[id]; saveCart(); renderCheckout(); }
function cartItems(){ return Object.entries(cart).map(([id,qty])=>({product:PRODUCTS.find(p=>p.id===id),quantity:qty})).filter(i=>i.product); }
function cartSubtotal(){ return cartItems().reduce((s,i)=>s+i.product.price*i.quantity,0); }
function cartDeliveryCharge(){ return deliveryType==='pickup' ? 0 : DELIVERY_CHARGE; }
function cartTotal(){ return cartSubtotal()+cartDeliveryCharge(); }
function cartCount(){ return Object.values(cart).reduce((s,q)=>s+q,0); }

function updateFab(){
  const fab = document.getElementById('fab');
  const count = cartCount();
  fab.classList.toggle('visible', count>0);
  document.getElementById('fab-count').textContent = count;
  document.getElementById('fab-total').textContent = '₹'+cartTotal();
}

/* ================= view switching ================= */
function showView(view, productId){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  window.scrollTo(0,0);
  if(view==='detail'){ currentProductId = productId; renderDetail(productId); }
  if(view==='checkout'){ renderCheckout(); }
  updateFab();
}

/* ================= stepper HTML ================= */
function stepperHtml(id, qty, size){
  const cls = size==='md' ? 'stepper md' : 'stepper';
  return '<div class="'+cls+'">'+
    '<button onclick="event.stopPropagation();decQty(\''+id+'\')" aria-label="Decrease">−</button>'+
    '<span>'+qty+'</span>'+
    '<button onclick="event.stopPropagation();incQty(\''+id+'\')" aria-label="Increase">+</button>'+
  '</div>';
}

/* ================= catalog ================= */
function renderCategoryPills(){
  const wrap = document.getElementById('category-pills');
  let html = '<button class="pill '+(activeCategory==='all'?'pill-active':'')+'" onclick="setCategory(\'all\')">'+t('allCategories')+'</button>';
  CATEGORIES.forEach(c=>{
    html += '<button class="pill '+(activeCategory===c?'pill-active':'')+'" onclick="setCategory(\''+c+'\')">'+c+'</button>';
  });
  wrap.innerHTML = html;
}
function setCategory(c){ activeCategory = c; renderCatalog(); }

function renderCatalog(){
  renderCategoryPills();
  const search = (document.getElementById('search-input').value||'').toLowerCase().trim();
  const filtered = PRODUCTS.filter(p=>{
    const matchesCat = activeCategory==='all' || p.category===activeCategory;
    const matchesSearch = p.name.toLowerCase().includes(search);
    return matchesCat && matchesSearch;
  });
  const grid = document.getElementById('product-grid');
  if(filtered.length===0){
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px 0;">No products found.</p>';
    return;
  }
  grid.innerHTML = filtered.map(p=>productCardHtml(p)).join('');
}

function productCardHtml(p){
  const qty = getQty(p.id);
  const outOfStock = p.stock_qty <= 0;
  let footer;
  if(outOfStock){
    footer = '<span style="font-size:0.72rem;color:var(--red);font-weight:600;">'+t('outOfStock')+'</span>';
  } else if(qty>0){
    footer = stepperHtml(p.id, qty);
  } else {
    footer = '<button class="btn btn-primary add-btn" onclick="event.stopPropagation();addToCart(\''+p.id+'\')">+ '+t('addToCart')+'</button>';
  }
  return '<div class="glass-card card">'+
    '<div class="card-emoji" onclick="showView(\'detail\',\''+p.id+'\')">'+p.emoji+'</div>'+
    '<div class="card-body">'+
      '<div class="card-name" onclick="showView(\'detail\',\''+p.id+'\')">'+p.name+'</div>'+
      '<p class="card-desc">'+p.description+'</p>'+
      '<div class="card-footer"><span class="card-price">₹'+p.price+'</span>'+footer+'</div>'+
    '</div>'+
  '</div>';
}

/* ================= product detail ================= */
function renderDetail(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  const qty = getQty(p.id);
  const actionHtml = qty>0 ? stepperHtml(p.id, qty, 'md') : '<button class="btn btn-primary" onclick="addToCart(\''+p.id+'\')">+ '+t('addToCart')+'</button>';
  document.getElementById('detail-card').innerHTML =
    '<div class="detail-emoji">'+p.emoji+'</div>'+
    '<div class="detail-info">'+
      '<span class="detail-category">'+p.category+'</span>'+
      '<h1 class="detail-name">'+p.name+'</h1>'+
      '<p class="detail-desc">'+p.description+'</p>'+
      '<div class="detail-price-row"><span class="detail-price">₹'+p.price+'</span>'+actionHtml+'</div>'+
    '</div>';
  const related = PRODUCTS.filter(x=>x.category===p.category && x.id!==p.id).slice(0,4);
  document.getElementById('related-grid').innerHTML = related.map(r=>productCardHtml(r)).join('');
}

/* ================= checkout ================= */
let checkoutForm = { name:'', email:'', phone:'', notes:'' };

function setDeliveryType(type){
  deliveryType = type;
  localStorage.setItem('qk_delivery', type);
  renderCheckout();
}

function isValidCheckout(){
  const items = cartItems();
  return items.length>0 &&
    checkoutForm.name.trim().length>1 &&
    /^\S+@\S+\.\S+$/.test(checkoutForm.email) &&
    /^\d{10}$/.test(checkoutForm.phone.replace(/\D/g,''));
}

function updateCheckoutField(field, value){
  checkoutForm[field] = value;
  const btn = document.getElementById('checkout-submit-btn');
  if(btn) btn.disabled = !isValidCheckout();
}

function renderCheckout(){
  const items = cartItems();
  const container = document.getElementById('checkout-content');

  if(items.length===0){
    container.innerHTML = '<div class="empty-state"><p>'+t('emptyCart')+'</p>'+
      '<button class="btn btn-primary" onclick="showView(\'catalog\')">'+t('backToCatalog')+'</button></div>';
    return;
  }

  const itemsHtml = items.map(i=>
    '<div class="cart-row">'+
      '<span class="cart-item-emoji">'+i.product.emoji+'</span>'+
      '<div class="cart-item-info">'+
        '<span class="cart-item-name">'+i.product.name+'</span>'+
        '<span class="cart-item-price">₹'+i.product.price+' each</span>'+
      '</div>'+
      stepperHtml(i.product.id, i.quantity)+
      '<button class="remove-btn" onclick="removeFromCart(\''+i.product.id+'\')">✕</button>'+
    '</div>'
  ).join('');

  const subtotal = cartSubtotal();
  const delivery = cartDeliveryCharge();
  const total = cartTotal();

  container.innerHTML =
    '<h1 class="co-title">'+t('yourCart')+'</h1>'+
    '<div class="glass-card co-section">'+itemsHtml+'</div>'+
    '<div class="glass-card co-section">'+
      '<h2 class="co-section-title">'+t('deliveryOption')+'</h2>'+
      '<div class="delivery-toggle">'+
        '<button class="delivery-option '+(deliveryType==='delivery'?'active':'')+'" onclick="setDeliveryType(\'delivery\')">🚴 '+t('homeDelivery')+'<span class="delivery-price">₹40</span></button>'+
        '<button class="delivery-option '+(deliveryType==='pickup'?'active':'')+'" onclick="setDeliveryType(\'pickup\')">🏪 '+t('selfPickup')+'<span class="delivery-price">'+t('free')+'</span></button>'+
      '</div>'+
    '</div>'+
    '<div class="glass-card co-section">'+
      '<h2 class="co-section-title">'+t('orderSummary')+'</h2>'+
      '<div class="summary-row"><span>'+t('subtotal')+'</span><span>₹'+subtotal+'</span></div>'+
      '<div class="summary-row"><span>'+t('deliveryCharge')+'</span><span>'+(delivery===0?t('free'):'₹'+delivery)+'</span></div>'+
      '<div class="summary-row summary-total"><span>'+t('total')+'</span><span>₹'+total+'</span></div>'+
    '</div>'+
    '<div class="glass-card co-section">'+
      '<h2 class="co-section-title">'+t('yourDetails')+'</h2>'+
      '<label class="field"><span>'+t('fullName')+'</span><input id="cf-name" type="text" value="'+checkoutForm.name+'" oninput="updateCheckoutField(\'name\',this.value)"></label>'+
      '<label class="field"><span>'+t('email')+'</span><input id="cf-email" type="email" value="'+checkoutForm.email+'" oninput="updateCheckoutField(\'email\',this.value)"></label>'+
      '<label class="field"><span>'+t('phone')+'</span><input id="cf-phone" type="tel" placeholder="10-digit mobile number" value="'+checkoutForm.phone+'" oninput="updateCheckoutField(\'phone\',this.value)"></label>'+
      '<label class="field"><span>'+t('notes')+'</span><textarea id="cf-notes" rows="2" oninput="updateCheckoutField(\'notes\',this.value)">'+checkoutForm.notes+'</textarea></label>'+
      '<p class="form-error" id="checkout-error" style="display:none;"></p>'+
      '<button id="checkout-submit-btn" class="btn btn-primary submit-btn" onclick="submitOrder()" '+(isValidCheckout()?'':'disabled')+'>'+t('placeOrder')+' · ₹'+total+'</button>'+
    '</div>';
}

/* ================= simulated order + OTP flow ================= */
let currentOrder = null;
let otpDigits = ['','','','','',''];
let demoOtp = '';
let resendCooldown = 0;
let resendTimer = null;

function generateOrderRef(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return 'ORD-'+code;
}

function submitOrder(){
  if(!isValidCheckout()) return;
  const items = cartItems();
  currentOrder = {
    order_ref: generateOrderRef(),
    status: 'pending',
    delivery_type: deliveryType,
    items: items.map(i=>({product_id:i.product.id, name:i.product.name, quantity:i.quantity, price:i.product.price})),
    subtotal: cartSubtotal(),
    delivery_charge: cartDeliveryCharge(),
    total: cartTotal(),
    customer: {...checkoutForm}
  };
  demoOtp = Math.floor(100000+Math.random()*900000).toString();
  otpDigits = ['','','','','',''];
  document.getElementById('otp-email').textContent = checkoutForm.email;
  document.getElementById('otp-demo-code').textContent = demoOtp;
  document.getElementById('otp-error').style.display = 'none';
  renderOtpBoxes();
  showView('otp');
}

function renderOtpBoxes(){
  const row = document.getElementById('otp-row');
  row.innerHTML = otpDigits.map((d,i)=>
    '<input class="otp-box" type="text" inputmode="numeric" maxlength="1" value="'+d+'" '+
    'oninput="onOtpInput('+i+',this)" onkeydown="onOtpKeydown('+i+',event)" id="otp-box-'+i+'">'
  ).join('');
  setTimeout(()=>{ const first = document.getElementById('otp-box-0'); if(first) first.focus(); }, 50);
}

function onOtpInput(index, el){
  const digit = el.value.replace(/\D/g,'').slice(-1);
  otpDigits[index] = digit;
  el.value = digit;
  if(digit && index<5){
    const next = document.getElementById('otp-box-'+(index+1));
    if(next) next.focus();
  }
  if(otpDigits.join('').length===6){ verifyOtp(); }
}
function onOtpKeydown(index, e){
  if(e.key==='Backspace' && !otpDigits[index] && index>0){
    const prev = document.getElementById('otp-box-'+(index-1));
    if(prev) prev.focus();
  }
}

function verifyOtp(){
  const entered = otpDigits.join('');
  const errorEl = document.getElementById('otp-error');
  if(entered.length!==6){ return; }
  if(entered !== demoOtp){
    errorEl.textContent = t('invalidOtp');
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';
  currentOrder.status = 'verified';
  cart = {};
  saveCart();
  showView('track');
  renderTracking();
}

function resendOtp(){
  if(resendCooldown>0) return;
  demoOtp = Math.floor(100000+Math.random()*900000).toString();
  document.getElementById('otp-demo-code').textContent = demoOtp;
  otpDigits = ['','','','','',''];
  renderOtpBoxes();
  resendCooldown = 60;
  const btn = document.getElementById('otp-resend-btn');
  btn.disabled = true;
  if(resendTimer) clearInterval(resendTimer);
  resendTimer = setInterval(()=>{
    resendCooldown--;
    if(resendCooldown<=0){
      clearInterval(resendTimer);
      btn.disabled = false;
      btn.textContent = t('resendOtp');
    } else {
      btn.textContent = t('resendIn')+' '+resendCooldown+'s';
    }
  },1000);
}

/* ================= order tracking (simulated) ================= */
const STATUS_STEPS = [
  {status:'verified', key:'statusVerified'},
  {status:'accepted', key:'statusAccepted'},
  {status:'paid', key:'statusPaid'},
  {status:'shipped', key:'statusShipped'},
  {status:'delivered', key:'statusDelivered'}
];

function advanceOrderDemo(){
  if(!currentOrder) return;
  const idx = STATUS_STEPS.findIndex(s=>s.status===currentOrder.status);
  if(idx < STATUS_STEPS.length-1){
    currentOrder.status = STATUS_STEPS[idx+1].status;
    if(currentOrder.status==='shipped'){
      currentOrder.shipping = { courier:'Nagpur Express', tracking_id:'NGP'+Math.floor(100000+Math.random()*900000), eta:'Within 2 hours' };
    }
    if(currentOrder.status==='paid') fireConfetti();
  }
  renderTracking();
}

function payNowDemo(){
  currentOrder.status = 'paid';
  fireConfetti();
  renderTracking();
}

function timelineHtml(currentStatus){
  const currentIndex = STATUS_STEPS.findIndex(s=>s.status===currentStatus);
  return '<div class="timeline">'+STATUS_STEPS.map((step,index)=>{
    const isComplete = index<=currentIndex;
    const marker = isComplete ? '✓' : (index+1);
    const line = index<STATUS_STEPS.length-1 ? '<div class="tl-line '+(index<currentIndex?'done':'')+'"></div>' : '';
    return '<div class="tl-step">'+
      '<div class="tl-marker-col"><div class="tl-marker '+(isComplete?'done':'')+'">'+marker+'</div>'+line+'</div>'+
      '<span class="tl-label '+(isComplete?'done':'')+'">'+t(step.key)+'</span>'+
    '</div>';
  }).join('')+'</div>';
}

function renderTracking(){
  if(!currentOrder){
    document.getElementById('track-content').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;">No order yet.</p>';
    return;
  }
  const o = currentOrder;
  let html = '';

  if(o.status==='paid' || o.status==='shipped' || o.status==='delivered'){
    html += '<div class="glass-card success-banner"><span class="success-icon">🎉</span><div>'+
      '<h2 class="success-title">'+t('paymentSuccess')+'</h2>'+
      '<p class="success-subtitle">'+t('thankYou')+'</p></div></div>';
  }

  html += '<div class="glass-card header-card"><span class="order-ref-label">'+t('orderRef')+'</span><h1 class="order-ref">'+o.order_ref+'</h1></div>';
  html += '<div class="glass-card track-section">'+timelineHtml(o.status)+'</div>';

  if(o.status==='accepted'){
    html += '<button class="btn btn-success pay-btn" onclick="payNowDemo()">'+t('payNow')+' · ₹'+o.total+'</button>';
  }

  if((o.status==='shipped'||o.status==='delivered') && o.shipping){
    html += '<div class="glass-card track-section"><h2 class="track-section-title">'+t('shippingInfo')+'</h2>'+
      '<div class="item-row"><span>'+t('courier')+'</span><span>'+o.shipping.courier+'</span></div>'+
      '<div class="item-row"><span>'+t('trackingId')+'</span><span>'+o.shipping.tracking_id+'</span></div>'+
      '<div class="item-row"><span>'+t('eta')+'</span><span>'+o.shipping.eta+'</span></div></div>';
  }

  html += '<div class="glass-card track-section"><h2 class="track-section-title">'+t('orderSummary')+'</h2>'+
    o.items.map(i=>'<div class="item-row"><span>'+i.name+' × '+i.quantity+'</span><span>₹'+(i.price*i.quantity)+'</span></div>').join('')+
    '<div class="item-row"><span>'+t('deliveryCharge')+'</span><span>'+(o.delivery_charge===0?t('free'):'₹'+o.delivery_charge)+'</span></div>'+
    '<div class="item-row total-row"><span>'+t('total')+'</span><span>₹'+o.total+'</span></div></div>';

  if(o.status!=='delivered'){
    html += '<div class="glass-card track-section"><p style="font-size:0.82rem;color:var(--text-muted);margin:0 0 4px;">Demo control — in production this step happens via admin action or the Razorpay webhook:</p>'+
      '<div class="demo-controls"><button class="btn btn-outline" onclick="advanceOrderDemo()">'+t('continueDemo')+'</button></div></div>';
  }

  document.getElementById('track-content').innerHTML = html;
}

/* ================= confetti (lightweight, no deps) ================= */
function fireConfetti(){
  const colors = ['#7C6FE9','#34D399','#F4F3F8'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden;';
  document.body.appendChild(container);
  for(let i=0;i<70;i++){
    const piece = document.createElement('div');
    const size = 6+Math.random()*6;
    piece.style.cssText = 'position:absolute;top:-20px;left:'+(Math.random()*100)+'%;'+
      'width:'+size+'px;height:'+size+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';'+
      'border-radius:'+(Math.random()>0.5?'50%':'2px')+';opacity:0.9;'+
      'transform:rotate('+(Math.random()*360)+'deg);';
    const duration = 1800+Math.random()*1400;
    const drift = (Math.random()*160-80);
    piece.animate(
      [
        { transform:'translate(0,0) rotate(0deg)', opacity:1 },
        { transform:'translate('+drift+'px, '+(window.innerHeight+40)+'px) rotate('+(Math.random()*720)+'deg)', opacity:0.2 }
      ],
      { duration, easing:'cubic-bezier(.25,.46,.45,.94)', fill:'forwards' }
    );
    container.appendChild(piece);
  }
  setTimeout(()=>container.remove(), 3400);
}

/* ================= init ================= */
applyTranslations();
renderCatalog();
updateFab();
</script>
